      .rp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); color: var(--text-3); font-size: var(--t-caption); }
      .rp-chip { padding: 2px 9px; border-radius: var(--r-pill); border: 1px solid var(--edge-hi); color: var(--text-2); }

      .rp-tri { width: 0; height: 0; margin-right: 8px; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
      .rp-skel { height: 132px; border-radius: var(--r-panel); border: 1px solid var(--edge); background: linear-gradient(100deg, var(--surface-1-94) 30%, var(--surface-2) 50%, var(--surface-1-94) 70%) 0 0 / 220% 100%; animation: rp-breathe 1.4s ease-in-out infinite; }

      #bar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: var(--sp-2); padding: var(--sp-3) max(16px, var(--safe-right)) calc(var(--sp-3) + var(--safe-bottom)) max(16px, var(--safe-left)); background: var(--surface-0-90); border-top: 1px solid var(--edge); pointer-events: auto; }

      @media (max-height: 480px) {

      .rp-menu-panel { display: grid; gap: var(--sp-3); width: min(340px, 100%); padding: var(--sp-5); border-radius: var(--r-panel); background: var(--surface-1-94); border: 1px solid var(--edge-hi); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }

      .tl-tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--edge-hi); }

      .tl-label { position: absolute; top: 3px; transform: translateX(4px); font: 700 10px / 1 var(--font-body); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .tl-track { position: absolute; left: 0; right: 0; top: 40px; height: 84px; border-radius: 6px; background: linear-gradient(180deg, #17202f, #0f1622); border-top: 1px solid var(--edge-hi); border-bottom: 1px solid var(--edge); }
      .tl-goal { position: absolute; top: 6px; bottom: 6px; width: 3px; margin-left: -1px; border-radius: 2px; }
      .tl-goal::after { content: ''; position: absolute; top: -4px; left: -3px; width: 9px; height: 9px; border-radius: 50%; background: inherit; }
      .tl-goal.tl-blue { background: var(--blue); } .tl-goal.tl-red { background: var(--red); }
      .tl-region { position: absolute; top: -4px; bottom: -4px; background: rgba(198, 255, 46, 0.18); border: 2px solid var(--brand); border-radius: 6px; cursor: grab; }
      .tl-region-label { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font: 800 11px / 1.4 var(--font-body); pointer-events: none; white-space: nowrap; }
      .tl-handle { position: absolute; top: -2px; bottom: -2px; width: 16px; background: var(--brand); cursor: ew-resize; touch-action: none; }
      .tl-handle::after { content: ''; position: absolute; left: 6px; top: 38%; width: 4px; height: 24%; border-left: 1px solid var(--brand-ink); border-right: 1px solid var(--brand-ink); }
      .tl-h-start { left: -10px; border-radius: 6px 0 0 6px; } .tl-h-end { right: -10px; border-radius: 0 6px 6px 0; }
      .tl-playhead { position: absolute; top: 0; bottom: 8px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); pointer-events: none; }
      .tl-playhead-cap { position: absolute; top: 0; left: -6px; width: 14px; height: 14px; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%); }
      .rp-ed-panels { display: contents; }
      .rp-ed-optsbtn { display: none; }
      @media (max-width: 900px), (max-height: 480px) {
        .rp-ed { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46px minmax(0, 1fr) 176px; grid-template-areas: 'head' 'center' 'tl'; }
        .rp-ed-head { gap: var(--sp-2); padding: 0 var(--sp-3); }
        .rp-ed-head .rp-btn { min-height: 32px; padding: 0 var(--sp-3); }
        .rp-ed-title, .rp-ed-sum { display: none; }
        .rp-ed-optsbtn { display: inline-flex; }
        .rp-ed-panels { display: none; position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%; overflow-y: auto; z-index: 3; background: var(--surface-1); border-top: 2px solid var(--brand); pointer-events: auto; }
        .rp-ed.rp-ed-opts .rp-ed-panels { display: block; }
        .rp-ed-left, .rp-ed-right { border: 0; overflow: visible; }
        .rp-ed-transport { padding: var(--sp-2) var(--sp-3); }
        .rp-ed-tools { overflow-x: auto; flex-wrap: nowrap; padding: var(--sp-2) var(--sp-3); scrollbar-width: none; }
        .rp-ed-tools > * { flex: none; }
        .rp-ed-zoomlabel, .rp-ed-tools input[type='range'] { display: none; }
        .rp-tool kbd { display: none; }
        .tl-ruler { height: 26px; }
        .tl-track { top: 32px; height: 64px; }
      }
      @media (max-height: 480px) {
        .rp-ed { grid-template-rows: 40px minmax(0, 1fr) 118px; }
        .rp-ed-transport { padding: 4px var(--sp-3); }
        .rp-ed-transport .rp-btn, .rp-ed-tools .rp-btn { min-height: 28px; font-size: 11px; }
        .rp-ed-tools { padding: 3px var(--sp-3); }
        .tl-ruler { height: 22px; }
        .tl-track { top: 26px; height: 40px; }
      }
      #error { position: absolute; inset: 0; display: grid; place-content: center; gap: var(--sp-4); text-align: center; padding: 16px; pointer-events: auto; }
    </style>
  </head>
